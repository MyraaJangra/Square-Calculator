<!DOCTYPE html>
<html>
    <head>
      <title>Square Calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    body{
    background-image: url(https://tse4.mm.bing.net/th/id/OIP.4n-Dwo4Amw0u4RB_iX6A-QHaF6?r=0&w=800&h=639&rs=1&pid=ImgDetMain&o=7&rm=3);
    background-repeat: no-repeat;
    background-size: cover;
    display:flex ;
    justify-content: center;
    align-items: center;
}
</style>
    </head>
    <body>
<div class="card p-4 my-4 shadow-lg">
    <h2 class="my-3"> Square Calculator</h2>
    <label class="form-label">Enter A Number</label>
    <input type="number" placeholder="Enter a number" class="form-control mb-3" id="num">
    <button class="btn btn-primary mb-3" onclick="calculateSquare()"> Calculate Square </button>
    <p id="result"></p>
</div>
<script>
    function calculateSquare(){
        let numInput = document.getElementById("num").value;

        if (numInput === "" || isNaN(numInput)) {
            alert("please enter a valed number");
            return;
        }
        let square = numInput*numInput;

        document.getElementById("result").innerHTML ="the square of "+ numInput+ " is "+ square;
    }
</script>
    </body>
</html>
